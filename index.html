<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SECRET BIRD 🐦</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(#87ceeb 0%, #bde9ff 65%, #4caf50 65%);
            height: 100vh;
        }

        .title {
            text-align: center;
            padding-top: 20px;
            position: relative;
            z-index: 10;
        }

        .title h1 {
            margin: 0;
            font-size: 32px;
        }

        .title p {
            margin: 8px 0;
        }

        .control {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        input {
            width: 220px;
            padding: 12px;
            font-size: 17px;
            text-align: center;
            border: 2px solid #333;
            border-radius: 8px;
        }

        button {
            margin-top: 10px;
            padding: 12px 22px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
        }

        .ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 35%;
            background: #4caf50;
        }

        .branch {
            position: absolute;
            width: 420px;
            height: 18px;
            background: #5d4037;
            left: 50%;
            top: 72%;
            transform: translateX(-50%);
            border-radius: 10px;
        }

        .bird {
            position: absolute;
            left: 50%;
            top: 58%;
            width: 100px;
            height: 80px;
            transform: translate(-50%, -50%);
            transition: none;
        }

        .body {
            position: absolute;
            width: 75px;
            height: 55px;
            background: black;
            border-radius: 50%;
            left: 10px;
            top: 20px;
        }

        .head {
            position: absolute;
            width: 55px;
            height: 55px;
            background: black;
            border-radius: 50%;
            left: 55px;
            top: 0;
        }

        .eye {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            left: 88px;
            top: 15px;
            z-index: 3;
        }

        .eye::after {
            content: "";
            position: absolute;
            width: 5px;
            height: 5px;
            background: black;
            border-radius: 50%;
            left: 3px;
            top: 3px;
        }

        .beak {
            position: absolute;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 28px solid orange;
            left: 105px;
            top: 20px;
        }

        .wing {
            position: absolute;
            width: 55px;
            height: 45px;
            background: #222;
            border-radius: 50%;
            left: 5px;
            top: 5px;
            transform-origin: center;
            animation: flap 0.25s infinite alternate;
        }

        @keyframes flap {
            from {
                transform: rotate(-25deg);
            }

            to {
                transform: rotate(30deg);
            }
        }

        .tail {
            position: absolute;
            left: -30px;
            top: 25px;
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 55px solid black;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            width: 120px;
            height: 40px;
            opacity: 0.9;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud::before {
            width: 55px;
            height: 55px;
            left: 20px;
            top: -25px;
        }

        .cloud::after {
            width: 60px;
            height: 60px;
            right: 15px;
            top: -30px;
        }

        .cloud1 {
            left: 8%;
            top: 22%;
        }

        .cloud2 {
            left: 65%;
            top: 25%;
        }

        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #ffd700;
            border-radius: 50%;
            right: 8%;
            top: 8%;
        }

        .flying {
            animation: flyAway 3s linear forwards;
        }

        @keyframes flyAway {
            0% {
                transform: translate(-50%, -50%) translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) translate(700px, -500px) rotate(10deg);
            }
        }
    </style>
</head>

<body>

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="title">
        <h1>🐦 SECRET BIRD</h1>
        <p>Enter the secret PIN to release the bird</p>
    </div>

    <div class="control">

        <input
            id="pin"
            type="password"
            placeholder="Enter PIN"
        >

        <br>

        <button onclick="unlockBird()">
            🔓 UNLOCK BIRD
        </button>

        <div id="status">
            🔐 Waiting for secret PIN...
        </div>

    </div>

    <div class="branch"></div>

    <div class="bird" id="bird">

        <div class="tail"></div>

        <div class="body"></div>

        <div class="wing"></div>

        <div class="head"></div>

        <div class="eye"></div>

        <div class="beak"></div>

    </div>

    <div class="ground"></div>


    <script>

        const SECRET_PIN = "BIRD786";

        function unlockBird() {

            const pin = document.getElementById("pin").value;

            const status = document.getElementById("status");

            const bird = document.getElementById("bird");

            if (pin === SECRET_PIN) {

                status.innerHTML =
                    "🟢 ACCESS GRANTED — BIRD FLYING!";

                status.style.color = "green";

                bird.classList.add("flying");

            } else {

                status.innerHTML =
                    "🔴 WRONG PIN!";

                status.style.color = "red";

                document.getElementById("pin").value = "";

            }
        }

        document.getElementById("pin").addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    unlockBird();
                }

            }
        );

    </script>

</body>
</html>
